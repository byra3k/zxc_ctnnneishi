<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAMP Chat</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--text:#e8eaed;--muted:#9aa0a6;--border:#2a2f3a;--user:#2563eb;--assistant:#232833;--err:#7f1d1d;--accent:#3b82f6}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex}
  .sidebar{width:260px;flex:0 0 260px;background:var(--panel);border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:12px}
  select,button,textarea{font:inherit;color:var(--text);border-radius:8px;border:1px solid var(--border);background:var(--panel2);padding:10px;outline:none}
  button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:not-allowed}
  .hint{margin-top:auto;font-size:12px;color:var(--muted)}
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  header{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
  #messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:min(760px,92%);padding:11px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px}
  .msg.assistant{align-self:flex-start;background:var(--assistant);border-bottom-left-radius:4px}
  .msg.error{background:var(--err)}
  .typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite;margin:0 2px}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  form{padding:12px 18px;border-top:1px solid var(--border);background:var(--panel);display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;min-height:46px;max-height:180px}
  form button{height:46px;padding:0 18px;background:var(--accent);border-color:var(--accent);font-weight:600}
</style>
</head>
<body>
  <aside class="sidebar">
    <h3 style="margin:0">SAMP Chat</h3>
    <label style="font-size:12px;color:var(--muted)">Модель</label>
    <select id="model"></select>
    <button id="pingBtn">Проверить</button>
    <button id="clear">Очистить</button>
    <div class="hint">Соединение: <span id="conn">—</span></div>
  </aside>
  <main>
    <header><span id="status">Готов</span><span id="modelBadge"></span></header>
    <div id="messages"></div>
    <form id="form"><textarea id="input" placeholder="Сообщение..."></textarea><button id="send">➤</button></form>
  </main>
<script>
  const API_URL = "/api/messages"; // Запрос идет на наш собственный сервер
  const MODELS = ["qwen3.8-omni-flash","deepseek-v4-pro","deepseek-v4.1-flash","glm-5.3","glm-5.3-flash","glm-5.3-prime","kimi-k3","deepseek-v4.1-flash-1017"];
  
  const $ = id => document.getElementById(id);
  const msgContainer = $("messages"), form = $("form"), input = $("input"), sendBtn = $("send");
  let state = { messages: [], busy: false };

  MODELS.forEach(m => { const o = document.createElement("option"); o.value = m; o.textContent = m; $("model").appendChild(o); });
  $("modelBadge").textContent = MODELS[0];

  function addMsg(role, text, isErr) {
    const d = document.createElement("div"); d.className = `msg ${role}${isErr ? " error" : ""}`; d.textContent = text;
    msgContainer.appendChild(d); msgContainer.scrollTop = msgContainer.scrollHeight;
  }
  function addTyping() { const d = document.createElement("div"); d.className = "msg assistant typing"; d.innerHTML = "<i></i><i></i><i></i>"; msgContainer.appendChild(d); msgContainer.scrollTop = msgContainer.scrollHeight; return d; }

  async function callAPI(payload) {
    const res = await fetch(API_URL, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload) });
    const text = await res.text(); let data;
    try { data = JSON.parse(text); } catch { throw new Error(text.slice(0, 100)); }
    if (!res.ok) throw new Error(data.error?.message || data.message || "Ошибка API");
    return data;
  }

  async function send(text) {
    text = text.trim(); if (!text || state.busy) return;
    state.messages.push({ role: "user", content: text }); addMsg("user", text);
    input.value = ""; state.busy = true; sendBtn.disabled = true; $("status").textContent = "Думает...";
    const typing = addTyping();
    try {
      const data = await callAPI({ model: $("model").value, max_tokens: 2048, messages: state.messages });
      const ans = data.content?.filter(b => b.type === "text").map(b => b.text).join("") || "(пусто)";
      state.messages.push({ role: "assistant", content: ans });
      typing.remove(); addMsg("assistant", ans);
    } catch (e) {
      typing.remove(); state.messages.pop(); addMsg("assistant", "Ошибка: " + e.message, true);
    } finally { state.busy = false; sendBtn.disabled = false; $("status").textContent = "Готов"; }
  }

  form.onsubmit = e => { e.preventDefault(); send(input.value); };
  input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } };
  $("clear").onclick = () => { state.messages = []; msgContainer.innerHTML = ""; addMsg("assistant", "Чат очищен."); };
  $("pingBtn").onclick = async () => {
    $("conn").textContent = "Проверка...";
    try { await callAPI({ model: $("model").value, max_tokens: 10, messages: [{ role: "user", content: "ping" }] }); $("conn").textContent = "✅ OK"; }
    catch (e) { $("conn").textContent = "❌ " + e.message; }
  };
</script>
</body>
</html>
