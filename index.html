<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Clone</title>
<style>
  /* Цветовая палитра в стиле DeepSeek */
  :root {
    --bg: #1c1d22;
    --sidebar-bg: #141519;
    --text-main: #e0e0e0;
    --text-muted: #888b94;
    --border: #2d2f36;
    --input-bg: #25262b;
    --accent: #4d6bfe;
    --accent-hover: #5b77ff;
    --msg-user: #2b2d36;
    --btn-active: #303342;
    --think-bg: #202127;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text-main); display: flex; overflow: hidden; }

  /* Сайдбар */
  .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px; transition: transform 0.3s ease; }
  .new-chat-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 20px; transition: background 0.2s; }
  .new-chat-btn:hover { background: var(--accent-hover); }
  .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .history-item { padding: 10px 12px; border-radius: 8px; font-size: 14px; color: var(--text-muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.2s; }
  .history-item:hover { background: var(--input-bg); color: var(--text-main); }
  .sidebar-bottom { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); text-align: center; }

  /* Основная область */
  .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
  .chat-container { flex: 1; overflow-y: auto; padding: 40px 20px 120px 20px; display: flex; flex-direction: column; align-items: center; scroll-behavior: smooth; }
  .chat-inner { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 24px; }

  /* Сообщения */
  .message { display: flex; flex-direction: column; line-height: 1.6; font-size: 16px; animation: fadeIn 0.3s ease; }
  .message.user { align-items: flex-end; }
  .message.user .bubble { background: var(--msg-user); padding: 12px 18px; border-radius: 18px; border-bottom-right-radius: 4px; max-width: 80%; }
  .message.assistant { align-items: flex-start; }
  .message.assistant .bubble { width: 100%; white-space: pre-wrap; word-wrap: break-word; }
  
  /* Блок размышлений */
  details.thought-box { background: var(--think-bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  details.thought-box summary { padding: 10px 14px; font-size: 13px; color: var(--text-muted); cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; outline: none; }
  details.thought-box summary::-webkit-details-marker { display: none; }
  details.thought-box summary:hover { color: var(--text-main); }
  details.thought-box .thought-content { padding: 14px; font-size: 14px; color: var(--text-muted); border-top: 1px solid var(--border); font-family: monospace; white-space: pre-wrap; }

  /* Поле ввода (плавающее снизу) */
  .input-wrapper { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, var(--bg) 40%); padding: 20px; display: flex; flex-direction: column; align-items: center; }
  .input-box { width: 100%; max-width: 800px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.2); transition: border-color 0.2s; }
  .input-box:focus-within { border-color: var(--text-muted); }
  .input-box textarea { width: 100%; background: transparent; border: none; color: var(--text-main); font-size: 16px; resize: none; outline: none; min-height: 24px; max-height: 200px; padding: 4px 0; font-family: inherit; }
  .input-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .toggles { display: flex; gap: 8px; }
  
  /* Кнопки-переключатели (Раздумие, Поиск) */
  .toggle-btn { display: flex; align-items: center; gap: 6px; background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
  .toggle-btn:hover { background: var(--btn-active); color: var(--text-main); }
  .toggle-btn.active { background: rgba(77, 107, 254, 0.15); border-color: var(--accent); color: var(--accent); }
  .toggle-btn svg { width: 14px; height: 14px; }
  
  .send-btn { background: var(--accent); color: white; border: none; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; }
  .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .send-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

  /* Анимации */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .typing-indicator { display: flex; gap: 4px; align-items: center; height: 24px; }
  .typing-indicator span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: blink 1.4s infinite; }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  /* Скроллбар */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>
<body>

  <!-- Сайдбар -->
  <aside class="sidebar">
    <button class="new-chat-btn" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Новый чат
    </button>
    <div class="history-list" id="historyList">
      <!-- История будет тут -->
    </div>
    <div class="sidebar-bottom">
      Render + SAMP API
    </div>
  </aside>

  <!-- Основная область -->
  <main class="main-content">
    <div class="chat-container" id="chatContainer">
      <div class="chat-inner" id="chatInner">
        <!-- Приветствие -->
        <div style="text-align: center; margin-top: 10vh; color: var(--text-muted);" id="welcomeScreen">
          <h1 style="font-size: 28px; color: var(--text-main); margin-bottom: 8px;">Чем я могу помочь?</h1>
          <p>Выберите модель в настройках и напишите сообщение.</p>
        </div>
      </div>
    </div>

    <!-- Поле ввода -->
    <div class="input-wrapper">
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="Отправьте сообщение..."></textarea>
        <div class="input-actions">
          <div class="toggles">
            <!-- Кнопка Раздумия -->
            <button class="toggle-btn" id="thinkToggle" title="Модель будет рассуждать перед ответом">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10H12V2z"></path><path d="M12 12 2.1 12"></path><path d="M12 12 12 2"></path></svg>
              Раздумие
            </button>
            <!-- Кнопка Поиска -->
            <button class="toggle-btn" id="searchToggle" title="Добавить инструкцию для поиска в интернете">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              Поиск
            </button>
          </div>
          <div style="display: flex; align-items: center; gap: 12px;">
            <select id="modelSelect" style="background: transparent; border: none; color: var(--text-muted); font-size: 12px; outline: none; cursor: pointer;">
              <option value="deepseek-v4-pro">deepseek-v4-pro</option>
              <option value="deepseek-v4.1-flash" selected>deepseek-v4.1-flash</option>
              <option value="qwen3.8-omni-flash">qwen3.8-omni-flash</option>
              <option value="glm-5.3">glm-5.3</option>
              <option value="glm-5.3-flash">glm-5.3-flash</option>
            </select>
            <button class="send-btn" id="sendBtn" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

<script>
  const API_URL = "/api/messages";
  
  // Состояние приложения
  let state = {
    messages: [],
    isBusy: false,
    useThink: false,
    useSearch: false
  };

  // DOM Элементы
  const chatContainer = document.getElementById("chatContainer");
  const chatInner = document.getElementById("chatInner");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const thinkToggle = document.getElementById("thinkToggle");
  const searchToggle = document.getElementById("searchToggle");
  const modelSelect = document.getElementById("modelSelect");
  const welcomeScreen = document.getElementById("welcomeScreen");

  // Авто-ресайз текстового поля
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
    sendBtn.disabled = input.value.trim() === "" || state.isBusy;
  });

  // Обработка Enter
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  // Переключатели
  thinkToggle.addEventListener("click", () => {
    state.useThink = !state.useThink;
    thinkToggle.classList.toggle("active", state.useThink);
  });

  searchToggle.addEventListener("click", () => {
    state.useSearch = !state.useSearch;
    searchToggle.classList.toggle("active", state.useSearch);
  });

  // Новая сессия
  document.getElementById("newChatBtn").addEventListener("click", () => {
    if (state.isBusy) return;
    state.messages = [];
    chatInner.innerHTML = "";
    chatInner.appendChild(welcomeScreen);
    welcomeScreen.style.display = "block";
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;
  });

  // Отрисовка сообщения
  function renderMessage(role, text, thoughtText = null, isError = false) {
    if (welcomeScreen.style.display !== "none") welcomeScreen.style.display = "none";

    const msgDiv = document.createElement("div");
    msgDiv.className = `message ${role}`;
    
    let html = "";

    // Если есть размышления, вставляем сворачиваемый блок
    if (thoughtText) {
      html += `
        <details class="thought-box">
          <summary>🤔 Процесс размышления...</summary>
          <div class="thought-content">${thoughtText}</div>
        </details>
      `;
    }

    // Сам ответ
    html += `<div class="bubble" ${isError ? 'style="color: #ff6b6b;"' : ''}>${text}</div>`;
    
    msgDiv.innerHTML = html;
    chatInner.appendChild(msgDiv);
    scrollToBottom();
  }

  // Индикатор загрузки (точки)
  function showTyping() {
    const div = document.createElement("div");
    div.className = "message assistant";
    div.id = "typingIndicator";
    div.innerHTML = `
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    `;
    chatInner.appendChild(div);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById("typingIndicator");
    if (el) el.remove();
  }

  function scrollToBottom() {
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  // Отправка
  async function sendMessage() {
    const text = input.value.trim();
    if (!text || state.isBusy) return;

    state.isBusy = true;
    sendBtn.disabled = true;
    input.value = "";
    input.style.height = "auto";

    renderMessage("user", text);
    state.messages.push({ role: "user", content: text });
    showTyping();

    // Формируем системный промпт на основе переключателей
    let systemPrompt = "";
    if (state.useThink) {
      systemPrompt += "Перед тем как ответить, подумай шаг за шагом. Обязательно оберни процесс своих размышлений в теги <thought>...</thought>, а сам ответ пиши после них. ";
    }
    if (state.useSearch) {
      systemPrompt += "Постарайся использовать свои знания для поиска актуальной информации. Если найдешь данные в интернете, сошлись на источник. ";
    }

    const payload = {
      model: modelSelect.value,
      max_tokens: 4096,
      messages: state.messages
    };

    // Добавляем system промпт, если он есть
    if (systemPrompt) {
      payload.system = systemPrompt;
    }

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        renderMessage("assistant", data.error?.message || "Ошибка API", null, true);
        state.isBusy = false;
        return;
      }

      // Извлекаем текст ответа (Anthropic API формат)
      let fullText = data.content?.filter(b => b.type === "text").map(b => b.text).join("") || "(пусто)";
      
      let thought = null;
      let answer = fullText;

      // Парсим теги <thought> если они есть
      if (fullText.includes("<thought>")) {
        const match = fullText.match(/<thought>([\s\S]*?)<\/thought>/);
        if (match) {
          thought = match[1].trim();
          answer = fullText.replace(match[0], "").trim();
        }
      }

      // Сохраняем в историю (без тегов размышлений)
      state.messages.push({ role: "assistant", content: answer });
      
      // Рендерим
      renderMessage("assistant", answer, thought);

    } catch (err) {
      removeTyping();
      renderMessage("assistant", "Сетевая ошибка: " + err.message, null, true);
    } finally {
      state.isBusy = false;
      sendBtn.disabled = input.value.trim() === "";
    }
  }

  sendBtn.addEventListener("click", sendMessage);
</script>
</body>
</html>
