<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SAMP Chat</title>
<style>
  :root {
    --bg-main: #0b0f19; --bg-sidebar: #0f1423; --bg-panel: #151c2c; --bg-input: #1a2235;
    --text-main: #e2e8f0; --text-muted: #94a3b8; --border: #1e293b;
    --accent: #3b82f6; --accent-hover: #2563eb; --user-bubble: #1e293b;
    --code-bg: #0f172a; --success: #10b981; --error: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; overflow: hidden; }

  /* ЭКРАН АВТОРИЗАЦИИ */
  #authScreen { position: fixed; inset: 0; background: var(--bg-main); display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; padding: 20px; }
  .auth-box { background: var(--bg-panel); padding: 24px; border-radius: 16px; border: 1px solid var(--border); width: 100%; max-width: 360px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .auth-tab { flex: 1; padding: 10px; background: none; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s; }
  .auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .auth-box h2 { margin: 0 0 20px 0; color: var(--text-main); font-size: 20px; }
  .auth-box input { width: 100%; padding: 12px; margin-bottom: 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: white; outline: none; font-size: 14px; }
  .auth-box input:focus { border-color: var(--accent); }
  .btn-login { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; margin-top: 5px; }
  .btn-login:hover { background: var(--accent-hover); }

  /* САЙДБАР И МОБИЛЬНОЕ МЕНЮ */
  .sidebar { width: 260px; flex-shrink: 0; background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border); transition: transform 0.3s ease; z-index: 100; }
  .mobile-header { display: none; background: var(--bg-sidebar); padding: 12px 16px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .hamburger { background: none; border: none; color: white; cursor: pointer; padding: 8px; display: none; }
  @media (max-width: 768px) {
    .sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    .mobile-header { display: flex; }
    .hamburger { display: block; }
    .main-content { width: 100%; }
    .chat-inner { padding: 10px; }
  }

  .new-chat-btn { margin: 16px; padding: 12px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .new-chat-btn:hover { background: var(--bg-input); border-color: var(--accent); }
  .chat-history { flex: 1; overflow-y: auto; padding: 0 16px; }
  .history-item { padding: 10px 12px; border-radius: 6px; font-size: 14px; color: var(--text-main); cursor: pointer; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-item:hover, .history-item.active { background: var(--bg-input); }
  .history-item.active { font-weight: 600; border-left: 3px solid var(--accent); }
  .sidebar-footer { padding: 16px; font-size: 12px; color: var(--text-muted); text-align: center; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .user-info { font-weight: bold; color: var(--accent); }
  .btn-admin { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid var(--success); padding: 6px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 12px; margin-top: 5px; }

  /* ОСНОВНАЯ ЧАСТЬ */
  .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; position: relative; }
  .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; scroll-behavior: smooth; }
  .chat-inner { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; flex: 1; }

  /* СООБЩЕНИЯ */
  .message { display: flex; flex-direction: column; line-height: 1.6; font-size: 15px; animation: fadeIn 0.3s ease; }
  .message.user { align-items: flex-end; }
  .message.user .bubble { background: var(--user-bubble); padding: 12px 18px; border-radius: 20px; border-bottom-right-radius: 4px; max-width: 90%; white-space: pre-wrap; }
  .message.assistant { align-items: flex-start; }
  .message.assistant .bubble { width: 100%; word-wrap: break-word; }

  /* БЛОКИ И КОД */
  details.thought-box { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  details.thought-box summary { padding: 10px 14px; font-size: 13px; color: var(--text-muted); cursor: pointer; }
  details.thought-box .thought-content { padding: 14px; font-size: 13px; color: var(--text-muted); border-top: 1px solid var(--border); font-family: monospace; white-space: pre-wrap; }
  .code-block { background: var(--code-bg); border-radius: 8px; overflow: hidden; margin: 12px 0; border: 1px solid var(--border); }
  .code-header { display: flex; justify-content: space-between; background: #1e293b; padding: 8px 14px; font-size: 12px; color: var(--text-muted); }
  .copy-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; }
  .code-block pre { margin: 0; padding: 14px; overflow-x: auto; color: #e2e8f0; font-family: monospace; font-size: 13px; }

  /* ВВОД */
  .input-wrapper { padding: 16px; background: linear-gradient(transparent, var(--bg-main) 20%); }
  .input-box { width: 100%; max-width: 800px; margin: 0 auto; background: var(--bg-input); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; }
  .input-box:focus-within { border-color: var(--accent); }
  .input-row { display: flex; align-items: flex-end; gap: 10px; }
  textarea { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 16px; resize: none; outline: none; min-height: 24px; max-height: 150px; padding: 4px 0; }
  .tools { display: flex; align-items: center; gap: 8px; margin-top: 10px; justify-content: space-between; }
  .left-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  
  .toggle-btn { display: flex; align-items: center; gap: 6px; background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }
  .toggle-btn.think.active { background: rgba(59, 130, 246, 0.15); border-color: var(--accent); color: var(--accent); }
  .toggle-btn.search.active { background: rgba(16, 185, 129, 0.15); border-color: var(--success); color: var(--success); }
  
  /* Кнопка отправки / стоп */
  .send-btn { background: var(--accent); color: white; border: none; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
  .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .send-btn:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }
  .send-btn.stop-mode { background: var(--error); }
  .send-btn.stop-mode:hover { background: #dc2626; }

  /* МОДЕЛИ */
  .model-selector { position: relative; }
  .model-btn { display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid transparent; color: var(--text-muted); font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .model-menu { position: absolute; bottom: 100%; right: 0; margin-bottom: 8px; width: 280px; max-height: 300px; overflow-y: auto; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; display: none; flex-direction: column; padding: 8px; z-index: 100; }
  .model-menu.show { display: flex; }
  .model-group-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; padding: 8px 10px 4px; }
  .model-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; }
  .model-item:hover { background: var(--bg-input); }
  .model-item.active { background: rgba(59, 130, 246, 0.1); color: var(--accent); }

  /* АДМИНКА */
  #adminModal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
  .admin-content { background: var(--bg-panel); width: 100%; max-width: 600px; border-radius: 12px; border: 1px solid var(--border); padding: 20px; max-height: 80vh; overflow-y: auto; }
  .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
  .admin-table th, .admin-table td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; }
  .admin-btn { padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; margin-right: 4px; }
  .btn-plus { background: var(--success); color: white; }
  .btn-minus { background: #f59e0b; color: white; }
  .btn-block { background: var(--error); color: white; }

  .typing-cursor::after { content: "▋"; animation: blink 1s infinite; color: var(--accent); }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
</style>
</head>
<body>

  <div id="authScreen">
    <div class="auth-box">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchAuth('login')">Вход</button>
        <button class="auth-tab" id="tabRegister" onclick="switchAuth('register')">Регистрация</button>
      </div>
      <div id="loginForm">
        <h2>С возвращением</h2>
        <input type="text" id="loginUser" placeholder="Username">
        <input type="password" id="loginPass" placeholder="Пароль">
        <button class="btn-login" onclick="doLogin()">Войти</button>
      </div>
      <div id="registerForm" style="display: none;">
        <h2>Создать аккаунт</h2>
        <input type="text" id="regUser" placeholder="Username">
        <input type="password" id="regPass" placeholder="Пароль">
        <input type="email" id="regEmail" placeholder="Email (необязательно)">
        <button class="btn-login" onclick="doRegister()">Зарегистрироваться</button>
      </div>
    </div>
  </div>

  <header class="mobile-header" style="position: absolute; top:0; left:0; right:0; z-index: 50;">
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <span>SAMP AI</span>
    <div style="width:24px;"></div>
  </header>

  <aside class="sidebar" id="sidebar">
    <button class="new-chat-btn" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Новый чат
    </button>
    <div class="chat-history" id="chatHistory"></div>
    <div class="sidebar-footer">
      <div class="user-info" id="userDisplay">Гость</div>
      <div id="limitDisplay" style="color: var(--text-muted); font-size: 11px;">Сообщений: -</div>
      <button class="btn-admin" id="adminBtn" style="display:none" onclick="openAdminPanel()">⚙️ Админ-панель</button>
      <button onclick="logout()" style="background:none; border:none; color:var(--error); cursor:pointer; font-size:12px; margin-top:5px;">Выйти</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="chat-container" id="chatContainer" style="margin-top: 50px;">
      <div class="chat-inner" id="chatInner">
        <div style="text-align: center; margin-top: 15vh; color: var(--text-muted);" id="welcomeScreen">
          <h1 style="font-size: 28px; color: var(--text-main); margin-bottom: 8px;">Чем помочь?</h1>
          <p>Выберите модель и напишите сообщение.</p>
        </div>
      </div>
    </div>

    <div class="input-wrapper">
      <div class="input-box">
        <div class="input-row">
          <textarea id="input" rows="1" placeholder="Сообщение..."></textarea>
          <button class="send-btn" id="sendBtn" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
        <div class="tools">
          <div class="left-tools">
            <button class="toggle-btn think" id="thinkToggle">Раздумие</button>
            <button class="toggle-btn search" id="searchToggle">Поиск</button>
          </div>
          
          <div class="model-selector" id="modelSelector">
            <button class="model-btn" id="modelBtn">
              <span id="currentModelName">qwen3.8-omni-flash</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div class="model-menu" id="modelMenu"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="adminModal">
    <div class="admin-content">
      <h2 style="margin-top:0;">Пользователи</h2>
      <table class="admin-table">
        <thead><tr><th>Username</th><th>Email</th><th>Лимит</th><th>Статус</th><th>Действия</th></tr></thead>
        <tbody id="adminUserList"></tbody>
      </table>
      <button onclick="closeAdminPanel()" style="margin-top:15px; background:var(--border); color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;">Закрыть</button>
    </div>
  </div>

<script>
  const API_URL = "/api/messages";
  let currentUser = JSON.parse(localStorage.getItem("samp_user") || "null");
  let currentChatId = Date.now().toString();
  let chats = JSON.parse(localStorage.getItem("samp_chats") || "{}");
  let currentMessages = [];
  
  let isBusy = false;
  let abortController = null; // Глобальный контроллер отмены

  let useThink = false, useSearch = false, selectedModel = "qwen3.8-omni-flash";
  
  const MODELS = {
    "Tier C": ["qwen3.8-omni-flash", "deepseek-v4-pro", "deepseek-v4.1-flash", "glm-5.3", "glm-5.3-flash", "glm-5.3-prime", "kimi-k3", "deepseek-v4.1-flash-1017"],
    "Tier B": ["gemini-4-argon", "gemini-4-carbon", "gpt-6-luna", "gpt-6.1-sol", "gpt-6-sol", "kimi-k3.1-pro", "deepseek-v4.1-flash-uncensored", "glm-5.3-uncensored", "glm-5.3-flash-uncensored"],
    "Tier A": ["claude-opus-5-5", "claude-opus-5", "gpt-6-astra"]
  };

  const $ = id => document.getElementById(id);
  const chatContainer = $("chatContainer"), chatInner = $("chatInner"), input = $("input"), sendBtn = $("sendBtn");

  function setBusyUI(busy) {
    isBusy = busy;
    if (busy) {
      sendBtn.disabled = false; 
      sendBtn.classList.add("stop-mode");
      sendBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"></rect></svg>';
    } else {
      sendBtn.disabled = input.value.trim() === "";
      sendBtn.classList.remove("stop-mode");
      sendBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>';
    }
  }

  function stopGeneration() {
    if (abortController) {
      abortController.abort();
      setBusyUI(false); // Сразу возвращаем кнопку
    }
  }

  function switchAuth(type) {
    if (type === 'login') {
      $("tabLogin").classList.add("active"); $("tabRegister").classList.remove("active");
      $("loginForm").style.display = "block"; $("registerForm").style.display = "none";
    } else {
      $("tabLogin").classList.remove("active"); $("tabRegister").classList.add("active");
      $("loginForm").style.display = "none"; $("registerForm").style.display = "block";
    }
  }

  async function doLogin() {
    const username = $("loginUser").value.trim(); const password = $("loginPass").value;
    if (!username || !password) return alert("Заполните все поля");
    try {
      const res = await fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username, password, action: "login" }) });
      const data = await res.json(); if (!res.ok) throw new Error(data.error);
      finishLogin(data);
    } catch (e) { alert("Ошибка: " + e.message); }
  }

  async function doRegister() {
    const username = $("regUser").value.trim(); const password = $("regPass").value; const email = $("regEmail").value.trim();
    if (!username || !password) return alert("Введите логин и пароль");
    try {
      const res = await fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username, password, email, action: "register" }) });
      const data = await res.json(); if (!res.ok) throw new Error(data.error);
      alert("Успешная регистрация!"); finishLogin(data);
    } catch (e) { alert("Ошибка: " + e.message); }
  }

  function finishLogin(data) {
    currentUser = data; localStorage.setItem("samp_user", JSON.stringify(currentUser));
    $("authScreen").style.display = "none"; $("userDisplay").textContent = currentUser.username;
    $("limitDisplay").textContent = currentUser.isAdmin ? "Администратор" : `Сообщений: ${currentUser.limit}`;
    if (currentUser.isAdmin) $("adminBtn").style.display = "block";
    if (data.blocked) alert("Внимание: ваш аккаунт заблокирован!");
  }

  function logout() { currentUser = null; localStorage.removeItem("samp_user"); location.reload(); }

  async function openAdminPanel() {
    const res = await fetch("/api/admin/users"); const users = await res.json();
    const tbody = $("adminUserList"); tbody.innerHTML = "";
    for (const [name, data] of Object.entries(users)) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${name}</td>
        <td style="font-size:12px; color:var(--text-muted);">${data.email || '-'}</td>
        <td>${data.isAdmin ? '∞' : data.limit}</td>
        <td>${data.blocked ? '<span style="color:var(--error)">Заблокирован</span>' : '<span style="color:var(--success)">Активен</span>'}</td>
        <td>
          <button class="admin-btn btn-plus" onclick="updateUser('${name}', 'setLimit', ${data.limit + 10})">+10</button>
          <button class="admin-btn btn-minus" onclick="updateUser('${name}', 'setLimit', ${Math.max(0, data.limit - 10)})">-10</button>
          <button class="admin-btn btn-block" onclick="updateUser('${name}', 'block', ${!data.blocked})">${data.blocked ? 'Разблок' : 'Блок'}</button>
        </td>`;
      tbody.appendChild(tr);
    }
    $("adminModal").style.display = "flex";
  }
  async function updateUser(username, action, value) {
    await fetch("/api/admin/update", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ targetUser: username, action, value }) });
    openAdminPanel();
  }
  function closeAdminPanel() { $("adminModal").style.display = "none"; }

  function toggleSidebar() { $("sidebar").classList.toggle("open"); }
  document.addEventListener("click", (e) => {
    if (window.innerWidth <= 768 && !$("sidebar").contains(e.target) && e.target.className !== "hamburger") {
      $("sidebar").classList.remove("open");
    }
  });

  function parseMarkdown(text) {
    if (!text) return "";
    let safe = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    safe = safe.replace(/```(\w*)\n([\s\S]*?)(?:```|$)/g, (match, lang, code) => `<div class="code-block"><div class="code-header"><span>${lang || 'code'}</span><button class="copy-btn" onclick="navigator.clipboard.writeText(this.parentElement.nextElementSibling.innerText); this.innerText='Copied!'">Copy</button></div><pre><code>${code}</code></pre></div>`);
    safe = safe.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
    return safe.replace(/\n/g, "<br>");
  }

  function renderHistory() {
    $("chatHistory").innerHTML = "";
    Object.keys(chats).sort((a,b) => b - a).forEach(id => {
      const div = document.createElement("div");
      div.className = `history-item ${id === currentChatId ? "active" : ""}`;
      div.textContent = chats[id].title || "Новый чат";
      div.onclick = () => {
        if (isBusy) return;
        currentChatId = id; currentMessages = [...chats[id].messages];
        chatInner.innerHTML = ""; $("welcomeScreen").style.display = "none";
        currentMessages.forEach(msg => renderMessage(msg.role, msg.content, msg.thought, false, true));
        renderHistory(); scrollToBottom(true);
        if (window.innerWidth <= 768) toggleSidebar();
      };
      $("chatHistory").appendChild(div);
    });
  }

  function scrollToBottom(force = false) {
    if (force || chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 150) {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  }

  function renderModelsMenu() {
    $("modelMenu").innerHTML = "";
    for (const [tier, models] of Object.entries(MODELS)) {
      const groupDiv = document.createElement("div");
      groupDiv.className = "model-group-title"; groupDiv.textContent = tier;
      $("modelMenu").appendChild(groupDiv);
      models.forEach(m => {
        const item = document.createElement("div");
        item.className = `model-item ${m === selectedModel ? 'active' : ''}`;
        item.innerHTML = `<span>${m}</span>`;
        item.onclick = () => { selectedModel = m; $("currentModelName").textContent = m; $("modelMenu").classList.remove("show"); renderModelsMenu(); };
        $("modelMenu").appendChild(item);
      });
    }
  }

  $("modelBtn").onclick = (e) => { e.stopPropagation(); $("modelMenu").classList.toggle("show"); };
  $("thinkToggle").onclick = (e) => { useThink = !useThink; e.currentTarget.classList.toggle("active", useThink); };
  $("searchToggle").onclick = (e) => { useSearch = !useSearch; e.currentTarget.classList.toggle("active", useSearch); };
  
  input.addEventListener("input", () => { 
    input.style.height = "auto"; 
    input.style.height = Math.min(input.scrollHeight, 150) + "px"; 
    if (!isBusy) sendBtn.disabled = input.value.trim() === ""; 
  });
  input.addEventListener("keydown", (e) => { 
    if (e.key === "Enter" && !e.shiftKey) { 
      e.preventDefault(); 
      if (isBusy) stopGeneration();
      else if (!sendBtn.disabled) sendMessage(); 
    } 
  });

  $("newChatBtn").onclick = () => {
    if (isBusy) return;
    currentChatId = Date.now().toString(); currentMessages = [];
    chatInner.innerHTML = ""; chatInner.appendChild($("welcomeScreen")); $("welcomeScreen").style.display = "block";
    input.value = ""; input.style.height = "auto"; setBusyUI(false);
    renderHistory();
    if (window.innerWidth <= 768) toggleSidebar();
  };

  function renderMessage(role, content, thought = null, isError = false, isHistory = false) {
    $("welcomeScreen").style.display = "none";
    const msgDiv = document.createElement("div"); msgDiv.className = `message ${role}`;
    let html = "";
    if (thought) html += `<details class="thought-box"><summary>🤔 Размышления...</summary><div class="thought-content">${thought}</div></details>`;
    const bubble = document.createElement("div"); bubble.className = "bubble";
    bubble.innerHTML = parseMarkdown(content);
    if (isError) bubble.style.color = "var(--error)";
    html += bubble.outerHTML;
    msgDiv.innerHTML = html; chatInner.appendChild(msgDiv);
    if (!isHistory) scrollToBottom();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || isBusy || !currentUser) return;
    if (currentUser.blocked) return alert("Вы заблокированы.");
    if (!currentUser.isAdmin && currentUser.limit <= 0) return alert("У вас закончились сообщения.");

    setBusyUI(true);
    currentMessages.push({ role: "user", content: text });
    renderMessage("user", text);
    input.value = ""; input.style.height = "auto";
    
    const msgDiv = document.createElement("div"); msgDiv.className = "message assistant";
    const bubble = document.createElement("div"); bubble.className = "bubble"; bubble.innerHTML = '<span class="typing-cursor"></span>';
    msgDiv.appendChild(bubble); chatInner.appendChild(msgDiv); scrollToBottom(true);

    let systemPrompt = "";
    if (useThink) systemPrompt += "Оберни размышления в теги <thought>...</thought>. ";
    if (useSearch) systemPrompt += "Ищи актуальную информацию в интернете. ";

    const payload = {
      model: selectedModel, max_tokens: 4096,
      messages: currentMessages.map(m => ({ role: m.role, content: m.content })),
      stream: true
    };
    if (systemPrompt) payload.system = systemPrompt;

    abortController = new AbortController();
    const signal = abortController.signal;
    let fullText = "";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-user": currentUser.username },
        body: JSON.stringify(payload),
        signal: signal
      });

      if (!res.ok) {
        const errorData = await res.json();
        throw new Error(errorData.error?.message || "Ошибка API");
      }

      if (!currentUser.isAdmin) {
        currentUser.limit--;
        $("limitDisplay").textContent = `Сообщений: ${currentUser.limit}`;
        localStorage.setItem("samp_user", JSON.stringify(currentUser));
      }

      const reader = res.body.getReader(); const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read(); 
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n"); buffer = lines.pop();

        for (const line of lines) {
          if (line.startsWith("data: ")) {
            const dataStr = line.slice(6).trim(); 
            if (dataStr === "[DONE]") continue;
            try {
              const parsed = JSON.parse(dataStr);
              if (parsed.type === "content_block_delta" && parsed.delta?.type === "text_delta") {
                fullText += parsed.delta.text;
                let thought = null, answer = fullText;
                const match = fullText.match(/<thought>([\s\S]*?)(?:<\/thought>|$)/);
                if (match) { thought = match[1].trim(); answer = fullText.replace(match[0], "").trim(); }

                let html = "";
                if (thought) html += `<details class="thought-box" open><summary>🤔 Размышляет...</summary><div class="thought-content">${thought}</div></details>`;
                html += parseMarkdown(answer);
                bubble.innerHTML = html + '<span class="typing-cursor"></span>';
                scrollToBottom();
              }
            } catch(e) {}
          }
        }
      }

      // Генерация завершилась сама (без отмены)
      bubble.innerHTML = bubble.innerHTML.replace('<span class="typing-cursor"></span>', '');
      let finalThought = null, finalAnswer = fullText;
      const match = fullText.match(/<thought>([\s\S]*?)<\/thought>/);
      if (match) { finalThought = match[1].trim(); finalAnswer = fullText.replace(match[0], "").trim(); }

      currentMessages.push({ role: "assistant", content: finalAnswer, thought: finalThought });
      if (!chats[currentChatId]) chats[currentChatId] = { title: text.slice(0, 30), messages: [] };
      chats[currentChatId].messages = currentMessages;
      localStorage.setItem("samp_chats", JSON.stringify(chats)); renderHistory();

    } catch (err) {
      // Если произошла отмена
      if (signal.aborted || err.name === 'AbortError') {
        // Убираем курсор и добавляем плашку
        let currentHtml = bubble.innerHTML.replace('<span class="typing-cursor"></span>', '');
        bubble.innerHTML = currentHtml + ' <span style="color:var(--text-muted);font-size:12px;">[Остановлено]</span>';
        
        // Сохраняем то, что успело прийти
        if (fullText) {
          let finalThought = null, finalAnswer = fullText;
          const match = fullText.match(/<thought>([\s\S]*?)<\/thought>/);
          if (match) { finalThought = match[1].trim(); finalAnswer = fullText.replace(match[0], "").trim(); }

          currentMessages.push({ role: "assistant", content: finalAnswer, thought: finalThought });
          if (!chats[currentChatId]) chats[currentChatId] = { title: text.slice(0, 30), messages: [] };
          chats[currentChatId].messages = currentMessages;
          localStorage.setItem("samp_chats", JSON.stringify(chats)); renderHistory();
        } else {
          // Если ничего не успело прийти, удаляем пустой пузырь
          msgDiv.remove();
        }
      } else {
        bubble.innerHTML = `<span style="color: var(--error);">Ошибка: ${err.message}</span>`;
      }
    } finally {
      abortController = null;
    }
  }

  sendBtn.onclick = () => {
    if (isBusy) stopGeneration();
    else sendMessage();
  };

  if (currentUser) finishLogin(currentUser);
  renderModelsMenu();
  renderHistory();
</script>
</body>
</html>
