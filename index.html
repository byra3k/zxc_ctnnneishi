<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAMP Chat</title>
<style>
  :root {
    --bg-main: #0b0f19;
    --bg-sidebar: #0f1423;
    --bg-panel: #151c2c;
    --bg-input: #1a2235;
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --border: #1e293b;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --user-bubble: #1e293b;
    --code-bg: #0f172a;
    --success: #10b981;
    --error: #ef4444;
  }

  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; overflow: hidden; }

  /* Сайдбар */
  .sidebar { width: 260px; flex-shrink: 0; background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
  .new-chat-btn { margin: 16px; padding: 12px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
  .new-chat-btn:hover { background: var(--bg-input); border-color: var(--accent); }
  .chat-history { flex: 1; overflow-y: auto; padding: 0 16px; }
  .history-item { padding: 10px 12px; border-radius: 6px; font-size: 14px; color: var(--text-main); cursor: pointer; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: 0.2s; }
  .history-item:hover, .history-item.active { background: var(--bg-input); }
  .history-item.active { font-weight: 600; border-left: 3px solid var(--accent); }
  .sidebar-footer { padding: 16px; font-size: 12px; color: var(--text-muted); text-align: center; border-top: 1px solid var(--border); }
  .version-tag { display: block; font-size: 10px; color: var(--accent); margin-top: 4px; }

  /* Основная часть */
  .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }
  .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; scroll-behavior: smooth; }
  .chat-inner { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; flex: 1; }

  /* Сообщения */
  .message { display: flex; flex-direction: column; line-height: 1.6; font-size: 16px; animation: fadeIn 0.3s ease; }
  .message.user { align-items: flex-end; }
  .message.user .bubble { background: var(--user-bubble); padding: 12px 20px; border-radius: 20px; border-bottom-right-radius: 4px; max-width: 85%; white-space: pre-wrap; }
  .message.assistant { align-items: flex-start; }
  .message.assistant .bubble { width: 100%; word-wrap: break-word; }
  .message img { max-width: 100%; max-height: 300px; border-radius: 8px; margin-bottom: 8px; display: block; }

  /* Блок размышлений */
  details.thought-box { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
  details.thought-box summary { padding: 10px 14px; font-size: 13px; color: var(--text-muted); cursor: pointer; user-select: none; }
  details.thought-box .thought-content { padding: 14px; font-size: 14px; color: var(--text-muted); border-top: 1px solid var(--border); font-family: monospace; white-space: pre-wrap; }

  /* Блоки кода */
  .code-block { background: var(--code-bg); border-radius: 8px; overflow: hidden; margin: 12px 0; border: 1px solid var(--border); }
  .code-header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 8px 14px; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  .copy-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; padding: 4px 8px; border-radius: 4px; }
  .copy-btn:hover { background: var(--bg-input); color: var(--text-main); }
  .code-block pre { margin: 0; padding: 14px; overflow-x: auto; color: #e2e8f0; font-family: monospace; font-size: 14px; }
  code { font-family: monospace; background: rgba(255,255,255,0.1); padding: 2px 4px; border-radius: 4px; font-size: 14px; }

  /* Поле ввода */
  .input-wrapper { padding: 20px; background: linear-gradient(transparent, var(--bg-main) 20%); }
  .input-box { width: 100%; max-width: 800px; margin: 0 auto; background: var(--bg-input); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0,0,0,0.3); transition: 0.2s; }
  .input-box:focus-within { border-color: var(--accent); }
  
  .image-preview { display: none; margin-bottom: 10px; position: relative; width: max-content; }
  .image-preview img { height: 60px; border-radius: 6px; border: 1px solid var(--border); }
  .remove-img { position: absolute; top: -6px; right: -6px; background: var(--error); color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 12px; cursor: pointer; }

  .input-row { display: flex; align-items: flex-end; gap: 10px; }
  textarea { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 16px; resize: none; outline: none; min-height: 24px; max-height: 200px; padding: 4px 0; font-family: inherit; }
  
  .tools { display: flex; align-items: center; gap: 8px; margin-top: 10px; justify-content: space-between; }
  .left-tools { display: flex; align-items: center; gap: 8px; }
  
  .icon-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; border-radius: 8px; transition: 0.2s; }
  .icon-btn:hover { background: #1e293b; color: var(--accent); }
  
  .toggle-btn { display: flex; align-items: center; gap: 6px; background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: 0.2s; }
  .toggle-btn:hover { background: #1e293b; }
  .toggle-btn.think.active { background: rgba(59, 130, 246, 0.15); border-color: var(--accent); color: var(--accent); }
  .toggle-btn.search.active { background: rgba(16, 185, 129, 0.15); border-color: var(--success); color: var(--success); }

  .send-btn { background: var(--accent); color: white; border: none; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
  .send-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .send-btn:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }

  /* Кастомный выпадающий список моделей */
  .model-selector { position: relative; }
  .model-btn { display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid transparent; color: var(--text-muted); font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
  .model-btn:hover { background: #1e293b; color: var(--text-main); }
  .model-menu { position: absolute; bottom: 100%; right: 0; margin-bottom: 8px; width: 300px; max-height: 400px; overflow-y: auto; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none; flex-direction: column; padding: 8px; z-index: 100; }
  .model-menu.show { display: flex; }
  .model-group-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; padding: 8px 10px 4px; letter-spacing: 0.5px; }
  .model-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text-main); }
  .model-item:hover { background: var(--bg-input); }
  .model-item.active { background: rgba(59, 130, 246, 0.1); color: var(--accent); }
  .status-icon { font-size: 12px; margin-left: 8px; }

  /* Анимации */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .typing-cursor::after { content: "▋"; animation: blink 1s infinite; color: var(--accent); margin-left: 2px; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--text-muted); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }
</style>
</head>
<body>

  <aside class="sidebar">
    <button class="new-chat-btn" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Новый чат
    </button>
    <div class="chat-history" id="chatHistory"></div>
    <div class="sidebar-footer">
      SAMP AI • 2026
      <span class="version-tag">v2.0 (Full)</span>
    </div>
  </aside>

  <main class="main-content">
    <div class="chat-container" id="chatContainer">
      <div class="chat-inner" id="chatInner">
        <div style="text-align: center; margin-top: 15vh; color: var(--text-muted);" id="welcomeScreen">
          <h1 style="font-size: 32px; color: var(--text-main); margin-bottom: 8px;">Чем я могу помочь?</h1>
          <p>Выберите модель в настройках и напишите сообщение.</p>
        </div>
      </div>
    </div>

    <div class="input-wrapper">
      <div class="input-box">
        <div class="image-preview" id="imagePreview">
          <img id="previewImg" src="" alt="preview">
          <button class="remove-img" id="removeImgBtn">×</button>
        </div>
        <div class="input-row">
          <textarea id="input" rows="1" placeholder="Отправьте сообщение..."></textarea>
          <button class="send-btn" id="sendBtn" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
        <div class="tools">
          <div class="left-tools">
            <button class="icon-btn" id="attachBtn" title="Загрузить изображение">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            </button>
            <input type="file" id="fileInput" accept="image/*" hidden>
            
            <button class="toggle-btn think" id="thinkToggle" title="Модель будет рассуждать перед ответом">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10H12V2z"></path><path d="M12 12 2.1 12"></path><path d="M12 12 12 2"></path></svg>
              Раздумие
            </button>
            
            <button class="toggle-btn search" id="searchToggle" title="Добавить поиск в интернете">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              Поиск
            </button>
          </div>
          
          <div class="model-selector" id="modelSelector">
            <button class="model-btn" id="modelBtn">
              <span id="currentModelName">qwen3.8-omni-flash</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div class="model-menu" id="modelMenu"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

<script>
  const API_URL = "/api/messages";
  
  // --- ВСЕ 17 МОДЕЛЕЙ ---
  const MODELS = {
    "Tier C": [
      "qwen3.8-omni-flash", "deepseek-v4-pro", "deepseek-v4.1-flash", "glm-5.3", 
      "glm-5.3-flash", "glm-5.3-prime", "kimi-k3", "deepseek-v4.1-flash-1017"
    ],
    "Tier B": [
      "gemini-4-argon", "gemini-4-carbon", "gpt-6-luna", "gpt-6.1-sol", 
      "gpt-6-sol", "kimi-k3.1-pro", "deepseek-v4.1-flash-uncensored", 
      "glm-5.3-uncensored", "glm-5.3-flash-uncensored"
    ],
    "Tier A": [
      "claude-opus-5-5", "claude-opus-5", "gpt-6-astra"
    ]
  };

  let currentChatId = Date.now().toString();
  let chats = JSON.parse(localStorage.getItem("samp_chats") || "{}");
  let currentMessages = [];
  let isBusy = false;
  let useThink = false;
  let useSearch = false;
  let attachedImage = null; 
  let selectedModel = "qwen3.8-omni-flash";
  let modelStatuses = {}; // Кэш пингов

  const $ = id => document.getElementById(id);
  const chatHistory = $("chatHistory"), chatInner = $("chatInner"), input = $("input");
  const sendBtn = $("sendBtn"), welcomeScreen = $("welcomeScreen");
  const chatContainer = $("chatContainer"), imagePreview = $("imagePreview"), previewImg = $("previewImg");
  const modelMenu = $("modelMenu"), modelBtn = $("modelBtn"), currentModelName = $("currentModelName");

  // --- MARKDOWN ---
  function parseMarkdown(text) {
    if (!text) return "";
    let safe = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    safe = safe.replace(/```(\w*)\n([\s\S]*?)(?:```|$)/g, (match, lang, code) => {
      return `<div class="code-block"><div class="code-header"><span>${lang || 'code'}</span><button class="copy-btn">Copy</button></div><pre><code>${code}</code></pre></div>`;
    });
    safe = safe.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
    safe = safe.replace(/`([^`]+)`/g, "<code>$1</code>");
    return safe.replace(/\n/g, "<br>");
  }

  document.addEventListener("click", (e) => {
    if (e.target.classList.contains("copy-btn")) {
      const code = e.target.closest(".code-block").querySelector("code").innerText;
      navigator.clipboard.writeText(code).then(() => {
        e.target.innerText = "Copied!";
        setTimeout(() => e.target.innerText = "Copy", 2000);
      });
    }
  });

  // --- ИСТОРИЯ ---
  function saveChats() {
    localStorage.setItem("samp_chats", JSON.stringify(chats));
    renderHistory();
  }

  function renderHistory() {
    chatHistory.innerHTML = "";
    Object.keys(chats).sort((a,b) => b - a).forEach(id => {
      const chat = chats[id];
      const div = document.createElement("div");
      div.className = `history-item ${id === currentChatId ? "active" : ""}`;
      div.textContent = chat.title || "Новый чат";
      div.onclick = () => loadChat(id);
      chatHistory.appendChild(div);
    });
  }

  function loadChat(id) {
    if (isBusy) return;
    currentChatId = id;
    currentMessages = [...chats[id].messages];
    chatInner.innerHTML = "";
    welcomeScreen.style.display = "none";
    currentMessages.forEach(msg => renderMessage(msg.role, msg.content, msg.thought, false, true));
    renderHistory();
    scrollToBottom(true);
  }

  function startNewChat() {
    if (isBusy) return;
    currentChatId = Date.now().toString();
    currentMessages = [];
    chatInner.innerHTML = "";
    chatInner.appendChild(welcomeScreen);
    welcomeScreen.style.display = "block";
    input.value = "";
    input.style.height = "auto";
    removeImage();
    sendBtn.disabled = true;
    renderHistory();
  }

  // --- РЕНДЕР ---
  function renderMessage(role, content, thought = null, isError = false, isHistory = false) {
    welcomeScreen.style.display = "none";
    const msgDiv = document.createElement("div");
    msgDiv.className = `message ${role}`;
    let html = "";

    if (role === "user" && Array.isArray(content)) {
      const textPart = content.find(c => c.type === "text");
      const imgPart = content.find(c => c.type === "image");
      if (imgPart) html += `<img src="data:${imgPart.source.media_type};base64,${imgPart.source.data}">`;
      if (textPart) html += `<div class="bubble">${parseMarkdown(textPart.text)}</div>`;
    } else {
      if (thought) {
        html += `<details class="thought-box"><summary>🤔 Процесс размышления...</summary><div class="thought-content">${thought}</div></details>`;
      }
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = parseMarkdown(content);
      if (isError) bubble.style.color = "var(--error)";
      html += bubble.outerHTML;
    }

    msgDiv.innerHTML = html;
    chatInner.appendChild(msgDiv);
    if (!isHistory) scrollToBottom();
  }

  // --- УМНЫЙ СКРОЛЛ ---
  function scrollToBottom(force = false) {
    const isNearBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 150;
    if (force || isNearBottom) {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  }

  // --- МОДЕЛИ И ПИНГ ---
  function renderModelsMenu() {
    modelMenu.innerHTML = "";
    for (const [tier, models] of Object.entries(MODELS)) {
      const groupDiv = document.createElement("div");
      groupDiv.className = "model-group-title";
      groupDiv.textContent = tier;
      modelMenu.appendChild(groupDiv);

      models.forEach(m => {
        const item = document.createElement("div");
        item.className = `model-item ${m === selectedModel ? 'active' : ''}`;
        
        let statusHtml = `<span class="status-icon" id="status-${m}"></span>`;
        if (modelStatuses[m] === 'ok') statusHtml = `<span class="status-icon" style="color:var(--success)">✅</span>`;
        if (modelStatuses[m] === 'error') statusHtml = `<span class="status-icon" style="color:var(--error)">❌</span>`;

        item.innerHTML = `<span>${m}</span> ${statusHtml}`;
        item.onclick = () => {
          selectedModel = m;
          currentModelName.textContent = m;
          modelMenu.classList.remove("show");
          renderModelsMenu();
        };
        modelMenu.appendChild(item);
      });
    }
  }

  async function pingAllModels() {
    if (Object.keys(modelStatuses).length > 0) return; // Проверяем только 1 раз

    const allModels = Object.values(MODELS).flat();
    allModels.forEach(m => {
      const el = $(`status-${m}`);
      if (el) el.innerHTML = `<div class="spinner"></div>`;
    });

    // Запускаем пинг с небольшой задержкой, чтобы не забанить IP
    await Promise.allSettled(allModels.map(async (m, index) => {
      return new Promise(resolve => {
        setTimeout(async () => {
          try {
            const res = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ model: m, max_tokens: 1, messages: [{ role: "user", content: "ping" }] })
            });
            if (res.ok) modelStatuses[m] = 'ok';
            else modelStatuses[m] = 'error';
          } catch (e) {
            modelStatuses[m] = 'error';
          }
          const el = $(`status-${m}`);
          if (el) {
            if (modelStatuses[m] === 'ok') { el.innerHTML = `✅`; el.style.color = "var(--success)"; }
            else { el.innerHTML = `❌`; el.style.color = "var(--error)"; }
          }
          resolve();
        }, index * 150); // Задержка 150мс между запросами
      });
    }));
  }

  modelBtn.onclick = (e) => {
    e.stopPropagation();
    modelMenu.classList.toggle("show");
    if (modelMenu.classList.contains("show")) {
      pingAllModels();
    }
  };

  document.addEventListener("click", (e) => {
    if (!modelBtn.contains(e.target) && !modelMenu.contains(e.target)) {
      modelMenu.classList.remove("show");
    }
  });

  // --- ИЗОБРАЖЕНИЯ ---
  $("attachBtn").onclick = () => $("fileInput").click();
  $("fileInput").onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const base64Data = ev.target.result.split(",")[1];
      attachedImage = { base64: base64Data, mimeType: file.type };
      previewImg.src = ev.target.result;
      imagePreview.style.display = "block";
      sendBtn.disabled = false;
    };
    reader.readAsDataURL(file);
  };

  function removeImage() {
    attachedImage = null;
    $("fileInput").value = "";
    imagePreview.style.display = "none";
    sendBtn.disabled = input.value.trim() === "";
  }
  $("removeImgBtn").onclick = removeImage;

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
    sendBtn.disabled = (input.value.trim() === "" && !attachedImage) || isBusy;
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  $("thinkToggle").onclick = (e) => {
    useThink = !useThink;
    e.currentTarget.classList.toggle("active", useThink);
  };

  $("searchToggle").onclick = (e) => {
    useSearch = !useSearch;
    e.currentTarget.classList.toggle("active", useSearch);
  };

  // --- ОТПРАВКА И СТРИМИНГ ---
  async function sendMessage() {
    const text = input.value.trim();
    if ((!text && !attachedImage) || isBusy) return;

    isBusy = true;
    sendBtn.disabled = true;
    
    let userContent;
    if (attachedImage) {
      userContent = [
        { type: "image", source: { type: "base64", media_type: attachedImage.mimeType, data: attachedImage.base64 } },
        { type: "text", text: text || "Что на этой картинке?" }
      ];
    } else {
      userContent = text;
    }

    currentMessages.push({ role: "user", content: userContent });
    renderMessage("user", userContent);
    
    input.value = "";
    input.style.height = "auto";
    removeImage();
    welcomeScreen.style.display = "none";

    const msgDiv = document.createElement("div");
    msgDiv.className = "message assistant";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = '<span class="typing-cursor"></span>';
    msgDiv.appendChild(bubble);
    chatInner.appendChild(msgDiv);
    scrollToBottom(true);

    let systemPrompt = "";
    if (useThink) {
      systemPrompt += "Перед ответом подумай шаг за шагом. Обязательно оберни размышления в теги <thought>...</thought>, а сам ответ пиши после них. ";
    }
    if (useSearch) {
      systemPrompt += "Используй свои знания для поиска актуальной информации в интернете. Если найдешь данные, сошлись на источники. ";
    }

    const payload = {
      model: selectedModel,
      max_tokens: 4096,
      messages: currentMessages.map(m => ({ role: m.role, content: m.content })),
      stream: true
    };
    if (systemPrompt) payload.system = systemPrompt;

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errorData = await res.json();
        throw new Error(errorData.error?.message || "Ошибка API");
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let fullText = "";
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          if (line.startsWith("data: ")) {
            const dataStr = line.slice(6).trim();
            if (dataStr === "[DONE]") continue;
            try {
              const parsed = JSON.parse(dataStr);
              if (parsed.type === "content_block_delta" && parsed.delta?.type === "text_delta") {
                fullText += parsed.delta.text;
                
                let thought = null;
                let answer = fullText;
                const match = fullText.match(/<thought>([\s\S]*?)(?:<\/thought>|$)/);
                if (match) {
                  thought = match[1].trim();
                  answer = fullText.replace(match[0], "").trim();
                }

                let html = "";
                if (thought) {
                   html += `<details class="thought-box" open><summary>🤔 Размышляет...</summary><div class="thought-content">${thought}</div></details>`;
                }
                html += parseMarkdown(answer);
                bubble.innerHTML = html + '<span class="typing-cursor"></span>';
                scrollToBottom();
              }
            } catch(e) {}
          }
        }
      }

      bubble.innerHTML = bubble.innerHTML.replace('<span class="typing-cursor"></span>', '');
      
      let finalThought = null;
      let finalAnswer = fullText;
      const match = fullText.match(/<thought>([\s\S]*?)<\/thought>/);
      if (match) {
        finalThought = match[1].trim();
        finalAnswer = fullText.replace(match[0], "").trim();
      }

      currentMessages.push({ role: "assistant", content: finalAnswer, thought: finalThought });
      
      if (!chats[currentChatId]) {
        const titleText = typeof userContent === "string" ? userContent : "Изображение";
        chats[currentChatId] = { title: titleText.slice(0, 30) || "Новый чат", messages: [] };
      }
      chats[currentChatId].messages = currentMessages;
      saveChats();

    } catch (err) {
      bubble.innerHTML = `<span style="color: var(--error);">Ошибка: ${err.message}</span>`;
    } finally {
      isBusy = false;
      sendBtn.disabled = input.value.trim() === "";
    }
  }

  // Запуск
  renderModelsMenu();
  renderHistory();
  if (Object.keys(chats).length > 0) {
    loadChat(Object.keys(chats).sort((a,b) => b - a)[0]);
  }
  $("newChatBtn").onclick = startNewChat;
  sendBtn.onclick = sendMessage;
</script>
</body>
</html>
